name: build-83hl-alt

# Альтернативная сборка: ядро и DTS из ветки jg/ubuntu-qcom-x1e-7.3.y
# (та ветка, на которой mich-de/ubuntu-ideapad-slim5x-83hl построил рабочий
# образ Ubuntu 26.04 на этом же ноутбуке). Остальной пайплайн (Arch rootfs,
# firmware в initramfs, modules.alias, UKI через objcopy с ImageBase+RVA)
# идентичен основному build.yml.
#
# Запуск: Actions -> build-83hl (alt) -> Run workflow.
# Параметры kernel_ref/dtb/firmware_url/image_size/release_tag — как в build.yml.

on:
  push:
    tags:
      - 'alt-*'
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Git URL ядра (пусто = jglathe/linux_ms_dev_kit)"
        required: false
        default: ""
      kernel_ref:
        description: "Ветка/тег/коммит ядра"
        required: false
        default: "jg/ubuntu-qcom-x1e-7.3.y"
      dtb:
        description: "DTB (пусто = lcd)"
        required: false
        default: ""
      firmware_url:
        description: "URL .tar.gz с прошивками (пусто = FIRMWARE_URL из vars/secrets)"
        required: false
        default: ""
      image_size:
        description: "Размер образа (6G, 8G, ...)"
        required: false
        default: "6G"
      release_tag:
        description: "Тег релиза, напр. v0.1.0 (пусто = только собрать)"
        required: false
        default: ""
      skip_release:
        description: "Не публиковать релиз"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-alt-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPO: ${{ inputs.kernel_repo || vars.KERNEL_REPO || 'https://github.com/jglathe/linux_ms_dev_kit' }}
  KERNEL_REF: ${{ inputs.kernel_ref || vars.KERNEL_REF || 'jg/ubuntu-qcom-x1e-7.3.y' }}
  KDEFCONFIG: ${{ vars.KDEFCONFIG || 'ubuntu_x1e_defconfig' }}
  DTB: ${{ inputs.dtb || vars.DTB || 'qcom/x1p42100-lenovo-ideapad-slim5x-lcd.dtb' }}
  FIRMWARE_URL: ${{ inputs.firmware_url || vars.FIRMWARE_URL || secrets.FIRMWARE_URL }}
  IMAGE_SIZE: ${{ inputs.image_size || vars.IMAGE_SIZE || '6G' }}
  ZSTD_LEVEL: "12"
  CCACHE: "1"

jobs:
  kernel:
    name: kernel (arm64, Glathe 7.3.y)
    runs-on: ubuntu-24.04
    # полная сборка ubuntu_x1e_defconfig на 4 ядрах с холодным ccache
    # не влезает в 180 минут; 350 — практический максимум GitHub (6 ч)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            clang lld llvm dwarves zstd xz-utils kmod git ccache

      - name: kernel source
        run: |
          set -euo pipefail
          if [ -f kernel/Makefile ]; then
            echo "использую ./kernel из репозитория"
            exit 0
          fi
          if git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | grep -qx kernel; then
            echo "submodule kernel"
            git submodule update --init --recursive kernel
            exit 0
          fi
          echo "клонирую $KERNEL_REPO @ $KERNEL_REF"
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPO" kernel \
            || { git clone "$KERNEL_REPO" kernel && git -C kernel checkout "$KERNEL_REF"; }

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-alt-${{ env.KERNEL_REF }}-${{ github.sha }}
          restore-keys: |
            ccache-alt-${{ env.KERNEL_REF }}-
            ccache-

      - name: build
        run: bash scripts/build-kernel.sh
        env:
          JOBS: "4"

      - name: summary
        run: |
          {
            echo "### Ядро (alt)"
            echo '```'
            cat out/kernel-pkg/kernel-release.txt
            ls -lh out/*.tar.zst
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-tar-alt
          path: out/linux-*.tar.zst
          retention-days: 14

  image:
    name: image (rootfs + disk)
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: qemu binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dosfstools mtools gdisk e2fsprogs zstd curl ca-certificates

      - uses: actions/download-artifact@v4
        with:
          name: kernel-tar-alt
          path: out

      - name: unpack kernel
        run: |
          mkdir -p out/kernel-pkg
          tar -C out/kernel-pkg -xf out/linux-*.tar.zst --zstd
          cat out/kernel-pkg/kernel-release.txt

      - name: rootfs
        run: sudo -E bash scripts/make-rootfs.sh
        env:
          EXTRA_PKGS: ${{ vars.EXTRA_PKGS }}

      - name: disk image
        run: sudo -E bash scripts/make-image.sh

      - name: summary
        run: |
          {
            echo "### Образ (alt)"
            echo '```'
            cat out/IMAGE_INFO.txt || true
            ls -lh out/*.img* 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: image-files-alt
          path: |
            out/arch-83hl.img.zst
            out/arch-83hl.img.zst.part*
            out/arch-83hl.img.zst.parts.txt
            out/IMAGE_INFO.txt
            out/SHA256SUMS.image
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [kernel, image]
    if: ${{ !inputs.skip_release && (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/alt-')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: image-files-alt
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: kernel-tar-alt
          path: out/kernel

      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || github.ref_name }}"
          body="Альтернативная сборка (Glathe 7.3.y) для IdeaPad Slim 5 14Q8X9 (83HL)."
          gh release create "$tag" out/* --title "$tag (alt)" --notes "$body" || \
          gh release upload "$tag" out/* --clobber