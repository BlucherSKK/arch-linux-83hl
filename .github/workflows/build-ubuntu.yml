name: build-ubuntu-83hl

on:
  workflow_dispatch:
    inputs:
      ubuntu_iso_url:
        description: "URL базового ubuntu-26.04.1-desktop-arm64.iso"
        required: false
        default: "https://cdimage.ubuntu.com/releases/26.04/release/ubuntu-26.04.1-desktop-arm64.iso"
      release_tag:
        description: "Тег релиза, например v0.1.0 (пусто = только артефакты)"
        required: false
        default: ""
      skip_release:
        description: "Не публиковать релиз"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-ubuntu-83hl-${{ github.ref }}
  cancel-in-progress: false

env:
  FULL_FIRMWARE_URL: ${{ secrets.FULL_FIRMWARE }}
  UBUNTU_ISO_URL: ${{ inputs.ubuntu_iso_url }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: build ubuntu 83hl iso (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: setup qemu binfmt for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: install build dependencies
        run: |
          set -euo pipefail
          sudo find /etc/apt/ -name "*.list" -o -name "*.sources" | while read -r f; do
            if [[ "$f" == *.list ]]; then
              sudo sed -i -E 's/^deb\s+(\[([^\]]*)\]\s+)?(https?:\/\/(azure\.)?archive\.ubuntu\.com|https?:\/\/security\.ubuntu\.com|https?:\/\/packages\.microsoft\.com)/deb [arch=amd64] \3/' "$f"
              sudo sed -i -E 's/\[arch=amd64\]\s+\[([^\]]*)\]/[arch=amd64,\1]/' "$f"
            elif [[ "$f" == *.sources ]]; then
              sudo awk '
                BEGIN { RS=""; ORS="\n\n" }
                {
                  if ($0 ~ /URIs:.*(archive\.ubuntu\.com|security\.ubuntu\.com|packages\.microsoft\.com)/ && $0 !~ /Architectures:/) {
                    sub(/\n?$/, "\nArchitectures: amd64", $0)
                  }
                  print $0
                }
              ' "$f" | sudo tee "${f}.tmp" >/dev/null
              sudo mv "${f}.tmp" "$f"
            fi
          done

          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
EOF

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools device-tree-compiler cpp mtools dosfstools \
            systemd-ukify sbsigntool python3-pefile build-essential gcc make kmod \
            clang lld llvm curl ca-certificates unzip openssl file \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: clone mich-de kit and glathe dts
        run: |
          set -euo pipefail
          mkdir -p work/kit
          git clone --depth 1 https://github.com/mich-de/ubuntu-ideapad-slim5x-83hl.git work/kit/repo
          git clone --depth 1 --filter=blob:none --sparse -b jg/ubuntu-qcom-x1e-7.3.y \
            https://github.com/jglathe/linux_ms_dev_kit.git work/kit/repo/src/glathe
          git -C work/kit/repo/src/glathe sparse-checkout set \
            arch/arm64/boot/dts/qcom include/dt-bindings include/uapi/linux scripts/dtc/include-prefixes

      - name: generate local mok keys
        run: |
          set -euo pipefail
          cd work/kit/repo
          mkdir -p keys
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 36500 -sha256 \
            -subj "/CN=83HL kernel signing (local MOK)/" \
            -addext "extendedKeyUsage=codeSigning" \
            -keyout keys/MOK.key -out keys/MOK.crt
          openssl x509 -in keys/MOK.crt -outform DER -out keys/MOK.der

      - name: fetch ubuntu iso and helper debs
        run: |
          set -euo pipefail
          cd work/kit/repo
          mkdir -p iso debs hdr
          curl -fSL --retry 3 "$UBUNTU_ISO_URL" -o iso/ubuntu-26.04.1-desktop-arm64.iso
          (
            cd debs
            apt-get download \
              systemd-ukify sbsigntool python3-pefile mokutil \
              python3-zstandard python3-libfdt libfdt1
          )
          (
            cd hdr
            for pkg in linux-headers-7.0.0-30-generic:arm64 linux-headers-7.0.0-43-generic:arm64 linux-modules-7.0.0-30-generic:arm64; do
              apt-get download "$pkg" || echo "WARN: package $pkg not found in current repo index"
            done
            if ! ls linux-headers-7.0.0-*-generic*.deb >/dev/null 2>&1; then
              LATEST_HDR="$(apt-cache search --names-only '^linux-headers-7\.0\.0-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -n1)"
              test -n "$LATEST_HDR"
              apt-get download "${LATEST_HDR}:arm64"
            fi
            for deb in *.deb; do
              dpkg-deb -x "$deb" /
            done
          )
          ls -la /usr/src/ | grep linux-headers || true

      - name: download and unpack firmware from FULL_FIRMWARE
        run: |
          set -euo pipefail
          test -n "${FULL_FIRMWARE_URL:-}"
          mkdir -p work/fw_raw work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL
          curl -fSL --retry 3 "$FULL_FIRMWARE_URL" -o work/fw_archive.bin

          if file work/fw_archive.bin | grep -qiE 'HTML|ASCII text'; then
            echo "Похоже на HTML-страницу Google Drive — пробуем скачать через confirm/id"
            FILE_ID="$(printf '%s' "$FULL_FIRMWARE_URL" | sed -nE 's/.*[?&]id=([^&]+).*/\1/p; s/.*\/d\/([^/]+).*/\1/p')"
            test -n "$FILE_ID"
            curl -fSL -c /tmp/gd_cookies.txt \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o /tmp/gd_page.html
            CONFIRM_TOKEN="$(sed -nE 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' /tmp/gd_page.html | head -n1)"
            if [ -n "$CONFIRM_TOKEN" ]; then
              curl -fSL -b /tmp/gd_cookies.txt \
                "https://drive.google.com/uc?export=download&confirm=${CONFIRM_TOKEN}&id=${FILE_ID}" \
                -o work/fw_archive.bin
            else
              curl -fSL -b /tmp/gd_cookies.txt \
                "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
                -o work/fw_archive.bin
            fi
          fi

          if tar -tzf work/fw_archive.bin >/dev/null 2>&1; then
            tar -xzf work/fw_archive.bin -C work/fw_raw
          elif unzip -tq work/fw_archive.bin >/dev/null 2>&1; then
            unzip -q work/fw_archive.bin -d work/fw_raw
          else
            echo "Не удалось распознать архив прошивок из FULL_FIRMWARE"
            file work/fw_archive.bin || true
            exit 1
          fi

          if [ -d work/fw_raw/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL ]; then
            cp -a work/fw_raw/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/. \
              work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/
          elif [ -d work/fw_raw/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL ]; then
            cp -a work/fw_raw/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/. \
              work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/
          else
            find work/fw_raw -maxdepth 1 -type f -exec cp -a {} \
              work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/ \;
          fi
          ls -la work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/

      - name: build video modules and 83hl iso
        run: |
          set -euo pipefail
          cd work/kit/repo
          if ! command -v gcc-15 >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/gcc-15
          fi
          sed -i 's/make -s -C/make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C/' scripts/build-video.sh
          bash scripts/build-video.sh 7.0.0-30-generic 7.0.0-43-generic
          mkdir -p /mnt/c
          bash scripts/build-iso.sh
          ls -lh out/

      - name: upload iso artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-83hl-iso
          path: |
            work/kit/repo/out/*.iso
            work/kit/repo/keys/MOK.der
          if-no-files-found: error
          retention-days: 14

      - name: publish release if requested
        if: ${{ !inputs.skip_release && inputs.release_tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          gh release create "$tag" work/kit/repo/out/*.iso work/kit/repo/keys/MOK.der \
            --title "Ubuntu 26.04 83HL (${tag})" \
            --notes "Сборка Ubuntu 26.04.1 ARM64 для Lenovo IdeaPad Slim 5x 14Q8X9 (83HL)." || \
          gh release upload "$tag" work/kit/repo/out/*.iso work/kit/repo/keys/MOK.der --clobber
