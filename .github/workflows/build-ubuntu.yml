name: build-ubuntu-83hl

# Сборка Ubuntu 26.04.1 ARM64 ISO для Lenovo IdeaPad Slim 5x 14Q8X9 (83HL)
# по рецепту mich-de/ubuntu-ideapad-slim5x-83hl, БЕЗ компиляции ядра:
#   - ядро и модули берутся готовыми из Ubuntu (resolute / resolute-updates);
#   - DTS компилируется из Glathe 7.3.y (sparse checkout);
#   - UKI собирается через resolute ukify (--devicetree-auto/--hwids/--sbat)
#     и подписывается локальной MOK;
#   - прошивки Qualcomm — из секрета FULL_FIRMWARE (Google Drive).
#
# Запуск: Actions -> build-ubuntu-83hl -> Run workflow.
#
# Если FULL_FIRMWARE не задан, сборка упадёт на шаге прошивок: положите
# архив с qcadsp8380.mbn/qccdsp8380.mbn/qcdxkmsucpurwa.mbn (и, желательно,
# adsp_dtbs.elf/cdsp_dtbs.elf) в секрет FULL_FIRMWARE (или FIRMWARE_URL).

on:
  workflow_dispatch:
    inputs:
      ubuntu_iso_url:
        description: "URL базового ubuntu-26.04.1-desktop-arm64.iso"
        required: false
        default: "https://cdimage.ubuntu.com/releases/26.04/release/ubuntu-26.04.1-desktop-arm64.iso"
      build_modules:
        description: "Собирать DKMS-модули 83HL (iris/videocc/EC)"
        type: boolean
        default: true
      release_tag:
        description: "Тег релиза, например v0.1.0 (пусто = только артефакты)"
        required: false
        default: ""
      skip_release:
        description: "Не публиковать релиз"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-ubuntu-83hl-${{ github.ref }}
  cancel-in-progress: false

env:
  FULL_FIRMWARE_URL: ${{ secrets.FULL_FIRMWARE || secrets.FIRMWARE_URL || vars.FULL_FIRMWARE || vars.FIRMWARE_URL }}
  UBUNTU_ISO_URL: ${{ inputs.ubuntu_iso_url }}
  UBUNTU_SUITE: resolute
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: build ubuntu 83hl iso (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: setup qemu binfmt for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools device-tree-compiler cpp mtools dosfstools \
            systemd-ukify sbsigntool python3-pefile python3-zstandard \
            kmod curl ca-certificates unzip openssl file

      - name: clone mich-de kit and glathe dts
        run: |
          set -euo pipefail
          mkdir -p work/kit
          git clone --depth 1 https://github.com/mich-de/ubuntu-ideapad-slim5x-83hl.git work/kit/repo
          git clone --depth 1 --filter=blob:none --sparse -b jg/ubuntu-qcom-x1e-7.3.y \
            https://github.com/jglathe/linux_ms_dev_kit.git work/kit/repo/src/glathe
          git -C work/kit/repo/src/glathe sparse-checkout set \
            arch/arm64/boot/dts/qcom include/dt-bindings include/uapi/linux scripts/dtc/include-prefixes

      - name: generate local mok keys
        run: |
          set -euo pipefail
          cd work/kit/repo
          mkdir -p keys
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 36500 -sha256 \
            -subj "/CN=83HL kernel signing (local MOK)/" \
            -addext "extendedKeyUsage=codeSigning" \
            -keyout keys/MOK.key -out keys/MOK.crt
          openssl x509 -in keys/MOK.crt -outform DER -out keys/MOK.der

      - name: fetch ubuntu iso
        run: |
          set -euo pipefail
          cd work/kit/repo
          mkdir -p iso
          curl -fSL --retry 3 "$UBUNTU_ISO_URL" -o iso/ubuntu-26.04.1-desktop-arm64.iso
          ls -lh iso/

      - name: detect iso kernel version
        id: kv
        run: |
          set -euo pipefail
          cd work/kit/repo
          osirrox -indev iso/ubuntu-26.04.1-desktop-arm64.iso -extract /casper/vmlinuz /tmp/vmlinuz.iso >/dev/null 2>&1
          KV=$(python3 -I -c "import pefile,sys;pe=pefile.PE(sys.argv[1],fast_load=True);print([s.get_data()[:s.Misc_VirtualSize] for s in pe.sections if s.Name.startswith(b'.uname')][0].decode().strip(chr(0)).strip())" /tmp/vmlinuz.iso)
          test -n "$KV"
          echo "iso kernel: $KV"
          echo "kv=$KV" >> "$GITHUB_OUTPUT"
          echo "base=${KV%-generic}" >> "$GITHUB_OUTPUT"

      - name: fetch ubuntu arm64 packages (resolute)
        run: |
          set -euo pipefail
          cd work/kit/repo
          KV="${{ steps.kv.outputs.kv }}"
          BASE="${{ steps.kv.outputs.base }}"
          mkdir -p debs hdr /tmp/arm64-apt/lists/partial /tmp/arm64-apt/cache/archives/partial /tmp/arm64-apt/empty.d
          touch /tmp/arm64-apt/status
          cat <<EOF > /tmp/arm64-apt/sources.list
          deb http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_SUITE} main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_SUITE}-updates main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_SUITE}-security main restricted universe multiverse
          EOF
          ARM64_APT=(
            apt-get
            -o APT::Architecture=arm64
            -o APT::Architectures=arm64
            -o Dir::Etc::sourcelist=/tmp/arm64-apt/sources.list
            -o Dir::Etc::sourceparts=/tmp/arm64-apt/empty.d
            -o Dir::State=/tmp/arm64-apt/lists
            -o Dir::State::status=/tmp/arm64-apt/status
            -o Dir::Cache=/tmp/arm64-apt/cache
          )
          "${ARM64_APT[@]}" update

          # helper debs shipped inside the ISO (/83hl/debs) for the installed system
          (
            cd debs
            "${ARM64_APT[@]}" download \
              systemd-ukify sbsigntool stubble python3-pefile mokutil \
              python3-zstandard python3-libfdt libfdt1
          )

          # kernel headers for the ISO kernel (common + -generic!) and modules
          # (System.map + modules.* used by build-iso.sh). libc6/libssl3t64 are
          # needed so qemu can run the prebuilt aarch64 kernel tools.
          (
            cd hdr
            "${ARM64_APT[@]}" download \
              "linux-headers-${BASE}" "linux-headers-${KV}" \
              "linux-modules-${KV}" libc6 libssl3t64
          )
          ls -lh debs hdr

          for deb in hdr/linux-headers-*.deb hdr/libc6_*.deb hdr/libssl3t64_*.deb; do
            sudo dpkg-deb -x "$deb" /
          done
          ls -d /usr/src/linux-headers-* | head
          ls -l /usr/lib/ld-linux-aarch64.so.1

      - name: use resolute ukify (needs --hwids/--devicetree-auto)
        run: |
          set -euo pipefail
          cd work/kit/repo
          mkdir -p /tmp/ukify
          dpkg-deb -x debs/systemd-ukify_*.deb /tmp/ukify
          # noble's ukify (255) lacks --hwids/--devicetree-auto; install 259.5
          sudo install -m755 /tmp/ukify/usr/bin/ukify /usr/local/bin/ukify
          ukify --version

      - name: download and unpack firmware from FULL_FIRMWARE
        run: |
          set -euo pipefail
          test -n "${FULL_FIRMWARE_URL:-}"
          mkdir -p work/fw_raw work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL
          curl -fSL --retry 3 "$FULL_FIRMWARE_URL" -o work/fw_archive.bin

          if file work/fw_archive.bin | grep -qiE 'HTML|ASCII text'; then
            echo "Похоже на HTML-страницу Google Drive — пробуем скачать через confirm/id"
            FILE_ID="$(printf '%s' "$FULL_FIRMWARE_URL" | sed -nE 's/.*[?&]id=([^&]+).*/\1/p; s/.*\/d\/([^/]+).*/\1/p')"
            test -n "$FILE_ID"
            curl -fSL -c /tmp/gd_cookies.txt \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o /tmp/gd_page.html
            CONFIRM_TOKEN="$(sed -nE 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' /tmp/gd_page.html | head -n1)"
            if [ -n "$CONFIRM_TOKEN" ]; then
              curl -fSL -b /tmp/gd_cookies.txt \
                "https://drive.google.com/uc?export=download&confirm=${CONFIRM_TOKEN}&id=${FILE_ID}" \
                -o work/fw_archive.bin
            else
              curl -fSL -b /tmp/gd_cookies.txt \
                "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
                -o work/fw_archive.bin
            fi
          fi

          if tar -tzf work/fw_archive.bin >/dev/null 2>&1; then
            tar -xzf work/fw_archive.bin -C work/fw_raw
          elif unzip -tq work/fw_archive.bin >/dev/null 2>&1; then
            unzip -q work/fw_archive.bin -d work/fw_raw
          else
            echo "Не удалось распознать архив прошивок из FULL_FIRMWARE"
            file work/fw_archive.bin || true
            exit 1
          fi

          DST=work/kit/repo/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL
          if [ -d work/fw_raw/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL ]; then
            cp -a work/fw_raw/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/. "$DST/"
          elif [ -d work/fw_raw/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL ]; then
            cp -a work/fw_raw/overlay/usr/lib/firmware/qcom/x1p42100/LENOVO/83HL/. "$DST/"
          elif [ -d work/fw_raw/qcom/x1p42100/LENOVO/83HL ]; then
            cp -a work/fw_raw/qcom/x1p42100/LENOVO/83HL/. "$DST/"
          else
            find work/fw_raw -maxdepth 1 -type f -exec cp -a {} "$DST/" \;
          fi
          ls -la "$DST/"
          for f in qcadsp8380.mbn qccdsp8380.mbn qcdxkmsucpurwa.mbn; do
            [ -f "$DST/$f" ] || echo "::warning::firmware $f not found in FULL_FIRMWARE archive"
          done

      - name: patch build-iso.sh for CI (no /mnt/c, optional modules)
        run: |
          set -euo pipefail
          cd work/kit/repo
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-build-iso.py" scripts/build-iso.sh
          bash -n scripts/build-iso.sh

      - name: build 83hl dkms modules (native arm64 container)
        if: ${{ inputs.build_modules }}
        run: |
          set -euo pipefail
          cd work/kit/repo
          KV="${{ steps.kv.outputs.kv }}"
          BASE="${{ steps.kv.outputs.base }}"
          # fastrpc is not shipped by build-video.sh and may not match the 7.0 API
          sed -i 's#obj-m += iris/ clk/ ec/ npu/ fastrpc/#obj-m += iris/ clk/ ec/ npu/#' dkms/83hl-drivers-1.0/Makefile
          mkdir -p out/modules
          # Build natively inside an arm64 resolute container: the prebuilt
          # aarch64 kernel tools (fixdep/modpost) then run without qemu, and
          # apt resolves the matching common+generic headers automatically.
          if docker run --rm --platform linux/arm64 \
               -v "$PWD:/work" -w /work \
               -e KV="$KV" -e BASE="$BASE" \
               ubuntu:26.04 bash -euo pipefail -c '
                 export DEBIAN_FRONTEND=noninteractive
                 printf "deb http://ports.ubuntu.com/ubuntu-ports resolute main restricted universe multiverse\ndeb http://ports.ubuntu.com/ubuntu-ports resolute-updates main restricted universe multiverse\ndeb http://ports.ubuntu.com/ubuntu-ports resolute-security main restricted universe multiverse\n" > /etc/apt/sources.list
                 rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
                 apt-get update
                 apt-get install -y --no-install-recommends \
                   gcc make kmod dwarves "linux-headers-${BASE}" "linux-headers-${KV}"
                 B=$(mktemp -d)
                 cp -a dkms/83hl-drivers-1.0/. "$B"/
                 make -C "/usr/src/linux-headers-${KV}" M="$B" modules -j"$(nproc)"
                 mkdir -p "out/modules/${KV}"
                 for m in iris/qcom-iris.ko clk/videocc-x1p42100.ko \
                          ec/qcom-hamoa-ec.ko ec/lenovo-83hl-ec.ko \
                          npu/cdsp-keepalive-83hl.ko; do
                   if [ -f "$B/$m" ]; then
                     strip --strip-debug "$B/$m" 2>/dev/null || true
                     install -m644 "$B/$m" "out/modules/${KV}/"
                     echo "built: $m"
                   else
                     echo "WARN: $m not built"
                   fi
                 done
                 rm -rf "$B"
               '; then
            sudo chown -R "$(id -u):$(id -g)" out/modules
          else
            echo "::warning::DKMS build in arm64 container failed — ISO will be built without 83HL modules"
            sudo rm -rf out/modules
          fi
          find out/modules -name '*.ko' -printf '%p\n' 2>/dev/null || true

      - name: build 83hl iso
        run: |
          set -euo pipefail
          cd work/kit/repo
          df -h /
          bash scripts/build-iso.sh
          ls -lh out/
          df -h /

      - name: upload iso artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-83hl-iso
          path: |
            work/kit/repo/out/*.iso
            work/kit/repo/keys/MOK.der
          if-no-files-found: error
          retention-days: 14

      - name: publish release if requested
        if: ${{ !inputs.skip_release && inputs.release_tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          gh release create "$tag" work/kit/repo/out/*.iso work/kit/repo/keys/MOK.der \
            --title "Ubuntu 26.04 83HL (${tag})" \
            --notes "Сборка Ubuntu 26.04.1 ARM64 для Lenovo IdeaPad Slim 5x 14Q8X9 (83HL)." || \
          gh release upload "$tag" work/kit/repo/out/*.iso work/kit/repo/keys/MOK.der --clobber
