# Минимальный, но надёжный initramfs для arm64-ноута.
# Без autodetect/kms: чуть больше размер, зато не зависим от udev-эвристик.
MODULES=()
BINARIES=()
# modules.dep/alias/symbols/builtin нужны udev в initramfs: иначе modprobe
# не разрешит modalias (совместимую строку DT) и модули (USB-PHY, storage)
# не загрузятся → корень на USB не найдётся.
FILES=(/usr/lib/modules/*/modules.dep /usr/lib/modules/*/modules.dep.bin \
       /usr/lib/modules/*/modules.alias /usr/lib/modules/*/modules.alias.bin \
       /usr/lib/modules/*/modules.symbols /usr/lib/modules/*/modules.symbols.bin \
       /usr/lib/modules/*/modules.builtin /usr/lib/modules/*/modules.builtin.bin \
       /usr/lib/modules/*/modules.builtin.modinfo)
HOOKS=(base udev modconf block filesystems keyboard fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3 -T0)
